services:
  postgres:
    image: postgres:16-alpine
    container_name: __PROJECT_SLUG__-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: __DB_NAME__
      POSTGRES_USER: __DB_NAME__
      POSTGRES_PASSWORD: __DB_NAME__
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __DB_NAME__ -d __DB_NAME__"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

